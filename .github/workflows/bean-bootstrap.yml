name: Bootstrap app.beanbrowser
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/bean-bootstrap.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Package name
        run: |
          sed -i 's/^TERMUX_APP__PACKAGE_NAME="com.termux"/TERMUX_APP__PACKAGE_NAME="app.beanbrowser"/' scripts/properties.sh
          grep -q '^TERMUX_APP__PACKAGE_NAME="app.beanbrowser"' scripts/properties.sh
      - name: Build bootstrap (aarch64)
        run: |
          S=./scripts/build-bootstraps.sh; [ -f "$S" ] || S=./scripts/build-bootstrap.sh
          set -o pipefail
          ./scripts/run-docker.sh "$S" --architectures aarch64 2>&1 | tee build.log
      - name: End of the log
        if: failure()
        run: |
          T=$(tail -n 60 build.log 2>/dev/null | tr -d '\r' | sed 's/%/%25/g' | sed -z 's/\n/%0A/g')
          echo "::error title=build log::$T"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l bootstrap-aarch64.zip
          gh release delete bean-bootstrap -y --cleanup-tag || true
          gh release create bean-bootstrap bootstrap-aarch64.zip --title "Bootstrap app.beanbrowser" --notes "Termux bootstrap built for app.beanbrowser"
