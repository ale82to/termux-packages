name: Bootstrap app.beanbrowser
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/bean-bootstrap.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Package name
        run: |
          sed -i 's/^TERMUX_APP__PACKAGE_NAME="com.termux"/TERMUX_APP__PACKAGE_NAME="app.beanbrowser"/' scripts/properties.sh
          grep -q '^TERMUX_APP__PACKAGE_NAME="app.beanbrowser"' scripts/properties.sh
          sed -i 's/PACKAGES+=("bzip2")/PACKAGES+=("libbz2")/' scripts/build-bootstraps.sh
          grep -q 'PACKAGES+=("libbz2")' scripts/build-bootstraps.sh
          sed -i '/mv -f "${BOOTSTRAP_TMPDIR}\/bootstrap-/ s#"\$TERMUX_PACKAGES_DIRECTORY/"#"$TERMUX_PACKAGES_DIRECTORY/output/"#' scripts/build-bootstraps.sh
          grep -q 'TERMUX_PACKAGES_DIRECTORY/output/"' scripts/build-bootstraps.sh
          mkdir -p output
          chmod a+rwx . output
      - name: Build bootstrap (aarch64)
        run: |
          S=./scripts/build-bootstraps.sh; [ -f "$S" ] || S=./scripts/build-bootstrap.sh
          set -o pipefail
          ./scripts/run-docker.sh "$S" --architectures aarch64 2>&1 | tee build.log
      - name: End of the log
        if: failure()
        run: |
          T=$(tail -n 60 build.log 2>/dev/null | tr -d '\r' | sed 's/%/%25/g' | sed -z 's/\n/%0A/g')
          echo "::error title=build log::$T"
      - name: Find the zip
        run: |
          Z=$(sudo find "$GITHUB_WORKSPACE" -name 'bootstrap-aarch64.zip' 2>/dev/null | head -1)
          if [ -z "$Z" ]; then
            T=$( (grep -n "mv:\|Creating\|Finished" build.log | tail -10) | tr -d '\r' | cut -c1-200 | sed 's/%/%25/g' | sed -z 's/\n/%0A/g')
            echo "::error title=zip not found::$T"
            exit 1
          fi
          sudo cp "$Z" "$RUNNER_TEMP/bootstrap-aarch64.zip"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/bootstrap-aarch64.zip"
          ls -l "$RUNNER_TEMP/bootstrap-aarch64.zip"
      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-aarch64
          path: ${{ runner.temp }}/bootstrap-aarch64.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete bean-bootstrap -y --cleanup-tag || true
          gh release create bean-bootstrap "$RUNNER_TEMP/bootstrap-aarch64.zip" --title "Bootstrap app.beanbrowser" --notes "Termux bootstrap built for app.beanbrowser"
